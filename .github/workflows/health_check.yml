name: Chequeo de salud de las capturas

on:
  workflow_dispatch: {}
  schedule:
    - cron: '40 9,21 * * *'   # dos veces por día, después de las corridas de SHN/SMN

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  chequear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # continue-on-error: así el reporte se guarda aunque haya FAIL;
      # el último paso hace fallar el workflow para que GitHub mande el mail.
      - name: Chequear
        id: chk
        run: python health_check.py data/health.json
        continue-on-error: true

      - name: Guardar reporte
        run: |
          git config user.name 'health-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/health.json
          if ! git diff --staged --quiet; then
            git commit -m 'Reporte de salud de capturas'
            git pull --rebase
            git push
          fi

      - name: Fallar si hay FAIL
        if: steps.chk.outcome == 'failure'
        run: exit 1
